<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — Exam System</title>
  <link rel="stylesheet" href="assets/css/exam.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f0f9ff;
      margin: 0;
    }
    .login-card {
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-header h2 {
      margin: 0;
      color: #0f172a;
    }
    .login-header p {
      color: #64748b;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="brand-icon" style="margin: 0 auto 16px auto; width: 48px; height: 48px; font-size: 24px; display: flex; align-items: center; justify-content: center;">E</div>
      <h2>Student Login</h2>
      <p>Enter your ID to view your exam results</p>
    </div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" placeholder="e.g. STU-001" required>
      </div>
      <div class="form-actions" style="margin-top: 24px;">
        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Login</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const studentId = document.getElementById("studentId").value.trim();
      if(studentId) {
        localStorage.setItem("loggedInStudent", studentId);
        window.location.href = "student-dashboard.html";
      }
    });
  </script>

</body>
</html>
