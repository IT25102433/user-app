<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Grading Panel — Exam System</title>
  <link rel="stylesheet" href="assets/css/exam.css">
  <style>
    .grading-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1px));
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">E</div>
      <h2>ExamSystem</h2>
    </div>

    <div class="sidebar-section">Results</div>
    <a href="teacher-grading.html" class="active">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      Grading Panel
    </a>
    <a href="student-dashboard.html">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
      Student View
    </a>
  </div>

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-title">Teacher Grading Panel</div>
    <div class="topbar-right">
      <div class="avatar">T</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="card">
      <div class="card-header">
        <div class="card-title">Filter by Exam</div>
      </div>
      <div id="gradingAlert" class="alert"></div>
      
      <div class="form-grid" style="grid-template-columns: 1fr auto;">
        <div class="form-group">
          <label for="filterExamId">Exam ID</label>
          <input type="text" id="filterExamId" placeholder="e.g. EXAM-2024-001">
        </div>
        <div class="form-actions" style="margin-top:24px; padding-top:0; border-top:0;">
          <button id="loadResultsBtn" class="btn btn-primary">Load Results</button>
        </div>
      </div>
      
      <div id="averageDisplay" style="margin-top: 16px; font-weight: bold; color: var(--primary);"></div>
    </div>

    <!-- Results Table -->
    <div class="card" style="margin-top:24px">
      <div class="card-header">
        <div class="card-title">Grade Sheet View</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Student ID</th>
              <th>MCQ Score</th>
              <th>Essay Score</th>
              <th>Total</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="gradingTableBody">
            <tr><td colspan="6" style="color:var(--text-muted); padding:18px 16px;">Enter Exam ID and Load Results.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  
  <!-- Edit Modal -->
  <div id="editResultModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="card-header">
        <div class="card-title">Update Manual Grade</div>
        <button id="closeEditModal" style="background:none;border:none;cursor:pointer;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="editAlert" class="alert"></div>
      <form id="editResultForm">
        <input type="hidden" id="editResultId">
        <div class="form-grid">
          <div class="form-group">
            <label for="editEssayScore">Essay Score</label>
            <input type="number" id="editEssayScore" min="0">
          </div>
          <div class="form-group">
            <label for="editFeedback">Feedback</label>
            <input type="text" id="editFeedback">
          </div>
          <div class="form-group">
            <label for="editStatus">Status</label>
            <select id="editStatus">
              <option value="PENDING">Pending</option>
              <option value="PUBLISHED">Published</option>
            </select>
          </div>
        </div>
        <div class="form-actions" style="margin-top:24px;">
          <button type="button" id="deleteResultBtn" class="btn btn-danger">Delete</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/results.js"></script>
</body>
</html>
