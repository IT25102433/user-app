<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Exam System</title>
  <link rel="stylesheet" href="frontend/assets/css/auth.css">
</head>
<body>
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="subtitle">Choose ADMIN or USER.</p>

    <label for="fullName">Full name</label>
    <input type="text" id="fullName" placeholder="Full name" autocomplete="name">

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Password" autocomplete="new-password">

    <label for="role">Role</label>
    <select id="role">
      <option value="">Select role</option>
      <option value="USER">USER</option>
      <option value="ADMIN">ADMIN</option>
    </select>

    <button type="button" onclick="registerUser()">Register</button>
    <p id="registerMsg" class="msg"></p>

    <div class="links">
      <a href="index.html">Already have an account? Sign in</a>
    </div>
  </div>
  <script src="frontend/assets/js/auth.js"></script>
</body>
</html>
