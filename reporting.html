<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporting & Analytics Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 40px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1e293b; margin-bottom: 20px; }
        .stat-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; font-size: 1.1em; }
        .stat-label { font-weight: 600; color: #64748b; }
        .stat-value { font-weight: bold; color: #0f172a; }
        #status-msg { text-align: center; margin-top: 20px; font-size: 1.2em; font-weight: bold; }
        .btn-refresh { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 1em; margin-top: 20px; transition: background 0.3s; }
        .btn-refresh:hover { background: #1d4ed8; }
        .passed { color: #16a34a; }
        .failed { color: #dc2626; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📊 Analytics Dashboard</h2>
        
        <div class="stat-item">
            <span class="stat-label">Average Marks:</span>
            <span id="avg-val" class="stat-value">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Highest Mark:</span>
            <span id="high-val" class="stat-value">-</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Lowest Mark:</span>
            <span id="low-val" class="stat-value">-</span>
        </div>

        <div id="status-msg"></div>

        <button class="btn-refresh" onclick="generateReport()">Generate Report</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 1. Supabase Configuration
        // Replace these with your actual Supabase project credentials
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. OOP Concept - Report Class for Analytics Logic
        class Report {
            constructor(dataArray) {
                this.data = dataArray; 
            }

            calculateAverage() {
                if (this.data.length === 0) return 0;
                let total = this.data.reduce((acc, row) => acc + (row.marks || 0), 0);
                return (total / this.data.length).toFixed(2);
            }

            getHighest() {
                if (this.data.length === 0) return 0;
                return Math.max(...this.data.map(row => row.marks || 0));
            }

            getLowest() {
                if (this.data.length === 0) return 0;
                return Math.min(...this.data.map(row => row.marks || 0));
            }
        }

        // 3. Data Fetching and UI Update
        async function generateReport() {
            try {
                // Fetch marks from 'results' table
                const { data, error } = await supabase
                    .from('results') 
                    .select('marks');

                if (error) throw error;

                // Instantiate the Report class
                const myReport = new Report(data);
                const avg = myReport.calculateAverage();
                const high = myReport.getHighest();
                const low = myReport.getLowest();

                // Update UI elements
                document.getElementById('avg-val').innerText = avg;
                document.getElementById('high-val').innerText = high;
                document.getElementById('low-val').innerText = low;

                const statusEl = document.getElementById('status-msg');
                if (avg >= 50) {
                    statusEl.innerHTML = '<span class="passed">Class Status: PASSED ✅</span>';
                } else {
                    statusEl.innerHTML = '<span class="failed">Class Status: FAILED ❌</span>';
                }

            } catch (err) {
                console.error("Error generating report:", err.message);
                alert("Failed to fetch data. Please check your Supabase credentials.");
            }
        }
    </script>
</body>
</html>
